services:
  # 1. Python AI Microservice (PyTorch + Keras + spaCy)
  python-ai:
    build: ./python-ai
    container_name: smarrtif_python_ai
    restart: always
    ports:
      - "8081:8000"

  # 2. Node.js API Gateway (Express + Multer)
  node-backend:
    build: ./node-backend
    container_name: smarrtif_node_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://python-ai:8000
    ports:
      - "5000:5000"
    depends_on:
      - python-ai

  # 3. React Frontend (Serving on Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://airesume.uk.to
    container_name: smarrtif_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - node-backend
