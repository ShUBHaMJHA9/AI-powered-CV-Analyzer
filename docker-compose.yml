version: '3.8'

services:
  # 1. Python AI Microservice (PyTorch + Keras + spaCy)
  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: smarrtif_python_ai
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - smarrtif_network

  # 2. Node.js API Gateway (Express + Multer)
  node-backend:
    build:
      context: ./node-backend
      dockerfile: Dockerfile
    container_name: smarrtif_node_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://python-ai:8000
    ports:
      - "5000:5000"
    depends_on:
      python-ai:
        condition: service_healthy
    networks:
      - smarrtif_network

  # 3. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: smarrtif_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - node-backend
    networks:
      - smarrtif_network

networks:
  smarrtif_network:
    driver: bridge
