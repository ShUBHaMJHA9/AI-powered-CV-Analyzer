server {
    listen 80;
    server_name _;

    # Allow large CV file uploads up to 50MB (Fixes HTTP 413 Request Entity Too Large)
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Proxy /api/ to Node.js backend (Docker internal network) ──
    location /api/ {
        proxy_pass http://smarrtif_node_backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # ── SPA routing fallback ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS: no-cache (browser checks for updates, Vite hashes ensure efficiency)
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets: cache images/fonts for 7 days
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
