server {
    listen 80;
    server_name _;

    # Allow large CV file uploads up to 50MB (Fixes HTTP 413 Request Entity Too Large)
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Enable stdout/stderr logging for docker logs visibility
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── High-Priority Prefix Match (^~) for /api ──
    # Prevents Nginx from falling through to static index.html or returning 405 Method Not Allowed
    location ^~ /api {
        proxy_pass http://smarrtif_node_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # ── SPA routing fallback (No Cache for index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JS/CSS: no-cache (browser checks for updates)
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
